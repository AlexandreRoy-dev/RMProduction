<!DOCTYPE html>
<html lang="fr-CA" class="scroll-smooth">
<head>
    <title>Merci | Roy Marketing</title>
    <meta name="robots" content="noindex, follow"> <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: '#0f4b3a', 
                        stone: {
                            50: '#F9F9F7', 
                            100: '#F5F5F3',
                            900: '#111111'
                        }
                    },
                    letterSpacing: {
                        'luxury': '0.15em', 
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap');
        
        .reveal { opacity: 0; transform: translateY(40px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        
        /* Premium button */
        .btn-premium { 
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-premium::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        .btn-premium:hover::before { left: 100%; }
        .btn-premium:hover { transform: translateY(-2px); box-shadow: 0 15px 40px -10px rgba(15, 75, 58, 0.4); }
        
        /* Checkmark Animation */
        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #0f4b3a;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: block;
            stroke-width: 2;
            stroke: #0f4b3a;
            stroke-miterlimit: 10;
            margin: 0 auto;
            box-shadow: inset 0px 0px 0px #0f4b3a;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }
        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 30px transparent; } }
    </style>
</head>
<body class="antialiased bg-stone-50 text-stone-900 font-sans selection:bg-brand selection:text-white flex flex-col min-h-screen">

    <nav class="w-full z-50 py-8 absolute top-0">
        <div class="max-w-[1800px] mx-auto px-6 text-center md:text-left">
            <a href="index.html" class="font-display font-bold text-lg tracking-widest uppercase text-stone-900 text-premium">
                Roy Marketing<span class="text-brand">.</span>
            </a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center relative px-6 overflow-hidden">
        
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-brand opacity-[0.03] rounded-full blur-3xl -z-10"></div>

        <div class="max-w-2xl mx-auto text-center z-10">
            
            <div class="reveal">
                <div class="mb-10">
                    <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                        <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                        <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                    </svg>
                </div>

                <span class="inline-block py-1.5 px-4 rounded-full bg-white border border-stone-200 shadow-sm text-brand text-[10px] sm:text-xs font-bold tracking-luxury uppercase mb-6">
                    Transmission réussie
                </span>
                
                <h1 class="font-display font-medium text-4xl md:text-6xl tracking-tight mb-6 text-stone-900 uppercase">
                    Demande <br class="hidden md:block">
                    <span class="font-bold">Reçue<span class="text-brand">.</span></span>
                </h1>
            </div>
            
            <div class="reveal delay-200 h-[2px] w-16 mx-auto bg-gradient-to-r from-transparent via-brand to-transparent mb-8"></div>
            
            <p class="reveal delay-300 text-base md:text-lg font-light leading-relaxed mb-12 text-stone-600">
                Merci de votre intérêt envers <strong>Roy Marketing</strong>. <br class="hidden md:block">
                Notre équipe stratégique analysera vos informations et vous contactera d'ici <strong>24 à 48 heures</strong> pour discuter de votre croissance.
            </p>
            
            <div class="reveal delay-500">
                <a href="index.html" class="btn-premium inline-block bg-stone-900 text-white px-10 py-4 uppercase tracking-widest text-xs font-bold transition-all shadow-premium hover:bg-brand">
                    Retourner à l'accueil
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-stone-50 border-t border-stone-200 py-8">
        <div class="max-w-[1800px] mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-center">
            <div>
                <p class="text-[10px] font-bold uppercase tracking-widest text-stone-400">© 2026 Roy Marketing.</p>
            </div>
            <div class="flex gap-6 text-[10px] font-medium tracking-widest text-stone-500 uppercase">
                 <a href="tel:+18194521975" class="hover:text-brand transition-colors">Tel: (819) 452-1975</a>
                 <a href="mailto:info@roymarketing.ca" class="hover:text-brand transition-colors">Email</a>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Animation Reveal standard
            const observerOptions = { root: null, rootMargin: '0px', threshold: 0.1 };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) { entry.target.classList.add('active'); }
                });
            }, observerOptions);
            document.querySelectorAll('.reveal').forEach(el => { observer.observe(el); });
        });
    </script>
</body>
</html>
